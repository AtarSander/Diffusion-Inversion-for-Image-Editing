[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "diff_inversion"
version = "0.0.1"
description = "A short description of the project."
authors = [
  { name = "Your name (or your organization/company/team)" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "numpy>=1.26",
    "accelerate>=1.13.0",
    "datasets>=4.4.1",
    "diffusers>=0.37.1",
    "huggingface-hub>=1.9.2",
    "hydra-core>=1.3.2",
    "ipywidgets>=8.1.8",
    "jaxtyping>=0.3.9",
    "loguru",
    "lpips>=0.1.4",
    "matplotlib>=3.10.8",
    "mkdocs",
    "peft>=0.18.1",
    "pillow>=12.1.1",
    "pip",
    "python-dotenv",
    "ruff",
    "safetensors>=0.7.0",
    "nvidia-cudnn-cu12",
    "nvidia-cusparselt-cu12",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.5.2",
    "statsmodels>=0.14.4",
    "torch>=2.11.0",
    "torchaudio>=2.11.0",
    "torchmetrics>=1.8.2",
    "torchvision>=0.26.0",
    "tqdm",
    "transformers>=5.5.0",
    "typer",
    "wandb>=0.25.1",
    "einops>=0.8.2",
    "opencv-python-headless>=5.0.0.93",
]
requires-python = "~=3.11.0"


[tool.ruff]
line-length = 99
src = ["diff_inversion"]
include = ["pyproject.toml", "diff_inversion/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting
ignore = ["F722"]

[tool.ruff.lint.isort]
known-first-party = ["diff_inversion"]

[tool.uv]
torch-backend = "cu128"

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[dependency-groups]
dev = [
    "jupyterlab>=4.5.6",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.15.8",
]

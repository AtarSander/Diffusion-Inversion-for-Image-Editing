device: auto
batch_size: 64

clip:
  model_name: openai/clip-vit-base-patch32

dino:
  model_name: facebook/dino-vits16
  add_pooling_layer: false
  transform:
    resize: 256
    center_crop: 224
    interpolation: bicubic
    mean:
      - 0.485
      - 0.456
      - 0.406
    std:
      - 0.229
      - 0.224
      - 0.225

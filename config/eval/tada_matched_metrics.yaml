    image_name: reconstructed_ddim.png
  - name: forward_2pct
    noise_name: inverted_noise_forward_2pct.pt
    image_name: reconstructed_forward_2pct.png
  - name: forward_4pct
    noise_name: inverted_noise_forward_4pct.pt
    image_name: reconstructed_forward_4pct.png

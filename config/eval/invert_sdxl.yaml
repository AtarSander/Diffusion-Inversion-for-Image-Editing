# @package _global_

model_id_override: null
input_dir: data/processed/sdxl_trajectories
overwrite: false
# Per-step inverse latents and predictions are useful for diagnostics but create
# 101 extra files per sample. Disable this for aggregate inversion-quality runs.
save_intermediates: true
# Compatibility control used by Athena aggregate runs; either false disables storage.
save_inversion_artifacts: true

lora:
  enabled: false
  checkpoint_path: null
  adapter_name: inversion
  scale: 1.0
  active_steps: null
  active_fraction: null
  r: 16
  lora_alpha: 8
  lora_dropout: 0.0
  bias: none
  init_lora_weights: gaussian
  target_modules:
    - to_k
    - to_q
    - to_v
    - to_out.0

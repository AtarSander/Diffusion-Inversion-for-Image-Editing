# @package _global_

input_dir: data/processed/sdxl_trajectories
overwrite: false
save_inversion_latents: true
save_inversion_pred_noises: true

lora:
  enabled: false
  mode: single
  checkpoint_path: null
  conditional_checkpoint_path: null
  unconditional_checkpoint_path: null
  adapter_name: inversion
  conditional_adapter_name: text_branch
  unconditional_adapter_name: null_branch
  scale: 1.0
  active_steps: null
  active_fraction: null
  r: 16
  lora_alpha: 8
  lora_dropout: 0.0
  bias: none
  init_lora_weights: gaussian
  target_modules:
    - to_k
    - to_q
    - to_v
    - to_out.0

# Apply the triangle-size directions to held-out circle photos: invert each
# circle (DDIM and MW), resample from its own inverted noise with alpha*s added.
source_manifest: ../../data/steering/circles8_eval/sources.jsonl
model:
  id: stabilityai/stable-diffusion-xl-base-1.0
  revision: 462165984030d82259a11f4367a4eed129e94a7b
  variant: fp16
  dtype: float16
  device: cuda
lora:
  checkpoint_path: ../../diff_inversion/steering/loras/checkpoint_r16.pt
  r: 16
  lora_alpha: 8
  target_modules: [to_q, to_k, to_v, to_out.0]
steps: 50
size: 1024
inversion_prompt: ""
reader_prompt: ""
null_seed: 123
edit:
  layers: last36
  start_call: 1
  stop_call: 50
  representations: [SA]
  strengths: [-3.0, -2.0, -1.0, 1.0, 2.0, 3.0]
  controls: ["true"]
  renorm: true

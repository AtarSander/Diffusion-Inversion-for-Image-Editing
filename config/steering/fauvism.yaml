# WikiArt Fauvism vs mixed other styles. Fully promptless: inversion and reads
# run with empty prompts, so directions come only from the images themselves.
source_manifest: ../../data/steering/wikiart_fauvism/sources.jsonl
model:
  id: stabilityai/stable-diffusion-xl-base-1.0
  revision: 462165984030d82259a11f4367a4eed129e94a7b
  variant: fp16
  dtype: float16
  device: cuda
lora:
  checkpoint_path: ../../diff_inversion/steering/loras/checkpoint_r16.pt
  r: 16
  lora_alpha: 8
  target_modules: [to_q, to_k, to_v, to_out.0]
steps: 50
size: 1024
inversion_prompt: ""
reader_prompt: ""
null_seed: 123
generation:
  # Pass 1 sweeps strengths to find the operating point; swap/gaussian controls
  # are run afterwards at the chosen representation and strength.
  guidance_scale: 5.0
  layers: last36
  start_call: 1
  stop_call: 50
  representations: [CA, SA, block]
  strengths: [1.0, 2.0, 4.0, 8.0]
  controls: ["true"]
  seeds: [42]
  prompts:
    - A small cottage beside a country road, with trees and fields.
    - Two pears and a ceramic jug on a wooden table.
    - A bicycle leaning against a brick wall on a quiet street.
    - A cat sitting on a windowsill beside a potted plant.

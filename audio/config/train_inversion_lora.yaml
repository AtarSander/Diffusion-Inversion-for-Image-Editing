# Train the AudioLDM2 shifted-denoiser inversion LoRA on cached DDIM trajectories.
# Run: uv run --python .venv/bin/python src/inversion_lora/train.py device=cuda:0

device: cpu # set cuda:N explicitly; never auto-grab a shared GPU
seed: 42

model_id: cvssp/audioldm2-large
num_inference_steps: 200 # must match the trajectory dataset's DDIM grid
adapter_name: inversion

data_root: ${oc.env:LORAINV_DATA_ROOT}/audioldm2_trajectories_gonogo_fp32
val_fraction: 0.05 # split by trajectory, never by transition
# 285k train transitions / 32 = ~8.9k steps per epoch, so max_train_steps=20000 is ~2.2 epochs.
# At batch 4 the sweep would have seen 0.28 of one epoch.
batch_size: 32
num_workers: 8

lora:
  r: 8
  lora_alpha: 4
  lora_dropout: 0.0
  init_lora_weights: true
  target_modules:
    - to_q
    - to_k
    - to_v
    - to_out.0

learning_rate: 5e-5
weight_decay: 0.0

# Exponential moving average of the adapter weights, saved next to every checkpoint as
# <name>_ema.pt in the same format. null disables it. 0.999 averages roughly the last 1000
# steps; keep it well below max_train_steps or the average never catches up.
ema_decay: 0.999
max_grad_norm: 1.0
gradient_accumulation_steps: 1
max_train_steps: 20000

log_every_steps: 50
eval_every_steps: 1000
save_every_steps: 2000
max_val_batches: 50

# Invert-then-denoise reconstruction eval. Costs ~2 * N * 2 * num_inference_steps UNet forwards;
# at 32 + 32 samples on the 200-step grid that is ~25k forwards, roughly 20 min on one H100.
# Set recon_every_steps to 0 to switch the whole thing off.
recon_every_steps: 2500
recon_num_generated: 32
recon_num_real: 32
recon_batch_size: 8
recon_duration_s: 10.24 # AudioLDM2's native length; the latent grid follows from it
recon_prompts_csv: ${oc.env:MEDLEY_PROMPTS_CSV}
recon_audio_root: ${oc.env:MEDLEYDB_AUDIO_DIR}
save_training_state: true
checkpoint_dir: ${oc.env:LORAINV_CHECKPOINT_ROOT}/audioldm2_inversion_r8
resume_from: null

wandb_project: audio-inversion-lora
wandb_mode: online # disabled for CPU smoke runs
run_name: null

hydra:
  run:
    dir: .
  output_subdir: null

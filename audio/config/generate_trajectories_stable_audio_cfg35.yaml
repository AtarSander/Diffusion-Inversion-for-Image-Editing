# Stable Audio Open trajectory generation AT THE DEPLOYMENT GUIDANCE, for experiment 1.
# Run:   uv run --python .venv/bin/python src/inversion_lora/generate_trajectories_stable_audio.py device=cuda:0
# Smoke: ... device=cuda:0 num_samples=2 num_inference_steps=20 output_dir=/tmp/sao_smoke

device: cpu # set to cuda:N explicitly; never auto-grab a shared GPU

model_id: stabilityai/stable-audio-open-1.0
# Stable Audio's own sigma grid. Its scheduler is an SDE, so trajectories come from the
# first-order ODE solver rather than scheduler.step, which is deterministic and exactly invertible.
# The `beta` grid the editing code's `ddim` mode builds is rejected: it queries the DiT ~1000x
# outside its trained timestep range and its audio clips by 22x. See output/sao_schedules/REPORT.md.
schedule: cosine
num_inference_steps: 100 # matches the editing baselines (edit_stableaudio_medleydb.py)
# Duration the timing conditioning declares; null uses the model's maximum (47.55 s), which is
# also what the MedleyMD edits run at since every mix is longer than the window. The latent length
# is fixed at 1024 either way, so this does not change the storage cost.
duration_s: null
# EXPERIMENT 1. The adapter is trained at w=1 but deployed at cfg_tar 3.5-7.0, and the shift gap
# it has to close grows ~3x from guidance 1.0 to 2.5 (output/sao_probe/REPORT.md) -- so it is
# fitting a gap several times smaller than the one it faces. Here the trajectory is driven by the
# guided combination, and both branches are cached so the loss can be formed at any w without
# regenerating. Costs two forwards per step (~2x generation) and 1.5x the disk.
guidance_scale: 3.5

captions_csv: editing/music_caps_dl/metadata/musiccaps-public.csv
caption_column: caption

# 1500 trajectories x 100 transitions x [64, 1024] fp32 is ~118 GB here: 26.5 MB of latents
# plus 26.2 MB for EACH of the two cached branches. Point this at scratch/lustre, never at
# the repo, and check free space first -- this is 1.5x the no-CFG dataset.
output_dir: ${oc.env:LORAINV_DATA_ROOT}/stable_audio_cosine_ode_cfg35_fp32
start_index: 0
num_samples: 1500 # null => all captions from start_index
seed: 42

store_dtype: float32
overwrite: false

hydra:
  run:
    dir: .
  output_subdir: null
